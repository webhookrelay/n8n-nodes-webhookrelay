# Local n8n for testing the Webhook Relay community nodes.
#
# n8n runs with --tunnel so it gets a public webhook URL that Webhook Relay's
# cloud can forward to — no need to expose your machine yourself. The built
# node package is mounted into n8n's custom-extensions folder, so a
# `npm run build` in the repo root is all it takes to load your latest code
# (restart the container to pick up changes).
#
#   cd ..  && npm run build      # build the nodes
#   cd docker && docker compose up
#   open http://localhost:5678
#
services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n-webhookrelay
    command: ['start', '--tunnel']
    ports:
      - '5678:5678'
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - N8N_SECURE_COOKIE=false
      # On first run n8n asks you to create a local owner account (throwaway —
      # this is a disposable test box; wipe it with `docker compose down -v`).
      # Load the community nodes mounted below from ~/.n8n/custom.
      - N8N_CUSTOM_EXTENSIONS=/home/node/.n8n/custom
      # Surface the input URLs / addresses the nodes log on activation.
      - N8N_LOG_LEVEL=info
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
    volumes:
      - n8n_data:/home/node/.n8n
      # Mount the built package (no node_modules needed — the nodes only use
      # n8n-workflow, which n8n provides).
      - ../package.json:/home/node/.n8n/custom/n8n-nodes-webhookrelay/package.json:ro
      - ../index.js:/home/node/.n8n/custom/n8n-nodes-webhookrelay/index.js:ro
      - ../dist:/home/node/.n8n/custom/n8n-nodes-webhookrelay/dist:ro

volumes:
  n8n_data:
