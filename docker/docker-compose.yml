# Local n8n for testing the Webhook Relay community nodes.
#
# The nodes receive events over an outbound WebSocket that n8n opens itself, so
# n8n needs NO public URL — no tunnel, no port forwarding, no relay agent. Only
# port 5678 (the editor) is published, to localhost.
#
#   cd ..  && npm install && npm run build   # build the nodes
#   cd docker && docker compose up
#   open http://localhost:5678
#
# The built package plus its runtime dependencies (the Webhook Relay SDK + ws)
# are mounted into n8n's custom-extensions folder. Rebuild and
# `docker compose restart` to pick up code changes.
services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n-webhookrelay
    command: ['start']
    ports:
      - '5678:5678'
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - N8N_SECURE_COOKIE=false
      # On first run n8n asks you to create a local owner account (throwaway —
      # this is a disposable test box; wipe it with `docker compose down -v`).
      # Load the community nodes mounted below from ~/.n8n/custom.
      - N8N_CUSTOM_EXTENSIONS=/home/node/.n8n/custom
      # Surface the input URLs / addresses the nodes log on activation.
      - N8N_LOG_LEVEL=info
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
    volumes:
      - n8n_data:/home/node/.n8n
      - ../package.json:/home/node/.n8n/custom/n8n-nodes-webhookrelay/package.json:ro
      - ../index.js:/home/node/.n8n/custom/n8n-nodes-webhookrelay/index.js:ro
      - ../dist:/home/node/.n8n/custom/n8n-nodes-webhookrelay/dist:ro
      # Runtime dependencies (@webhookrelay/sdk + ws). n8n-workflow resolves to
      # n8n's own copy, so a production install (no devDependencies) is cleanest.
      - ../node_modules:/home/node/.n8n/custom/n8n-nodes-webhookrelay/node_modules:ro

volumes:
  n8n_data:
